name: wayfarer
description: AI Wayfarer - travel planning and live-companion app for Paul.
publish_to: 'none'
version: 0.5.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  dio: ^5.4.0
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.0
  geolocator: ^11.0.0
  intl: ^0.19.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.0
  uuid: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
